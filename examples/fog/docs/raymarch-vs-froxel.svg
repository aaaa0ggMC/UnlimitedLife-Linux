  <text x='40' y='806' font-size='20' fill='#8A99A4' font-weight='600'>代价 ∝ 像素数 × 步数</text>
  <text x='940' y='722' font-size='22' fill='#1F2C36'>① 先用 compute 把视锥切成 froxel，每格独立积分一次。</text>
  <text x='940' y='758' font-size='22' fill='#5C6E7A'>② fragment 中每个像素沿深度，把经过的 froxel 依次混合。</text>
  <text x='940' y='806' font-size='20' fill='#8A99A4' font-weight='600'>代价 ∝ froxel 数 + 像素数 × 切片数</text>
